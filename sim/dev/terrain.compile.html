<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terrain shader check</title>
<!--
  Compiles the terrain's programs (base and L0 tile material, with and without the sun's
  shadow map) on the GPU this page runs on, without any terrain data, and lists per program:
  compile / link status with the driver's log, and the sampler units it uses (vertex +
  fragment; ANGLE on D3D11 allows 16). Open it from the local server: /dev/terrain.compile.html
  The result is also in window.__terrainCheck (for scripts).
-->
<script type="importmap">{ "imports": { "three": "../vendor/three/build/three.module.js" } }</script>
<style>
  body { font: 14px/1.4 ui-monospace, Consolas, monospace; background: #15171a; color: #d8dadc; padding: 16px; }
  .ok { color: #7fd37f; } .bad { color: #ff7a7a; } pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h3>Terrain shaders on this GPU</h3>
<pre id="out">compiling...</pre>
<script type="module">
import * as THREE from 'three';
import { TERRAIN_VERT, TERRAIN_FRAG, MAX_RWY } from '../js/terrain/terrainShaders.js';

const out = document.getElementById('out');
const lines = [];
const say = (s, cls) => { lines.push(cls ? `<span class="${cls}">${s}</span>` : s); out.innerHTML = lines.join('\n'); };

const canvas = document.createElement('canvas');
canvas.width = canvas.height = 64;
const renderer = new THREE.WebGLRenderer({ canvas });
const gl = renderer.getContext();
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
say(`GPU: ${dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)}`);
say(`texture units: ${gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS)} fragment, ${gl.getParameter(gl.MAX_VERTEX_TEXTURE_IMAGE_UNITS)} vertex, `
  + `${gl.getParameter(gl.MAX_COMBINED_TEXTURE_IMAGE_UNITS)} combined; max anisotropy ${renderer.capabilities.getMaxAnisotropy()}`);

function material(l0) {
  // uniforms are irrelevant for compiling; the light uniforms are needed because lights: true
  const uniforms = THREE.UniformsUtils.clone(THREE.UniformsLib.lights);
  if (l0) uniforms.uRwyA = { value: Array.from({ length: MAX_RWY }, () => new THREE.Vector4()) };
  return new THREE.ShaderMaterial({
    name: l0 ? 'TerrainL0' : 'Terrain', uniforms, vertexShader: TERRAIN_VERT, fragmentShader: TERRAIN_FRAG,
    defines: l0 ? { USE_L0: 1 } : {}, lights: true, fog: false,
  });
}

const SAMPLERS = new Set([gl.SAMPLER_2D, gl.SAMPLER_3D, gl.SAMPLER_CUBE, gl.SAMPLER_2D_SHADOW, gl.SAMPLER_2D_ARRAY,
  gl.SAMPLER_2D_ARRAY_SHADOW, gl.SAMPLER_CUBE_SHADOW, gl.INT_SAMPLER_2D, gl.INT_SAMPLER_3D, gl.INT_SAMPLER_CUBE,
  gl.INT_SAMPLER_2D_ARRAY, gl.UNSIGNED_INT_SAMPLER_2D, gl.UNSIGNED_INT_SAMPLER_3D, gl.UNSIGNED_INT_SAMPLER_CUBE,
  gl.UNSIGNED_INT_SAMPLER_2D_ARRAY]);

const result = { ok: true, programs: [] };
const errors = [];
const origError = console.error;
console.error = (...a) => { errors.push(a.join(' ')); origError(...a); };
const camera = new THREE.PerspectiveCamera(60, 1, 1, 1000);
for (const shadows of [false, true]) {
  const scene = new THREE.Scene();
  renderer.shadowMap.enabled = shadows;
  const sun = new THREE.DirectionalLight(0xffffff, 1);
  sun.castShadow = shadows;
  scene.add(sun);
  const geo = new THREE.PlaneGeometry(1, 1);
  for (const l0 of [false, true]) {
    const m = new THREE.Mesh(geo, material(l0));
    m.receiveShadow = shadows;
    m.frustumCulled = false;
    scene.add(m);
  }
  const t0 = performance.now();
  try { renderer.compile(scene, camera); renderer.render(scene, camera); } catch (e) { errors.push(String(e)); }
  say(`${shadows ? 'with' : 'without'} the shadow map: compiled in ${(performance.now() - t0).toFixed(0)} ms`);
}
console.error = origError;

for (const p of renderer.info.programs || []) {
  if (!/Terrain/.test(p.name)) continue;
  const prog = p.program;
  const linked = gl.getProgramParameter(prog, gl.LINK_STATUS);
  const names = [];
  if (linked) {
    const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const u = gl.getActiveUniform(prog, i);
      if (SAMPLERS.has(u.type)) names.push(u.name);
    }
  }
  const ok = linked && !p.diagnostics && names.length <= 16;
  result.ok &&= ok;
  result.programs.push({ name: p.name, linked, samplers: names.length, names, diagnostics: p.diagnostics || null });
  say(`${ok ? 'OK ' : 'BAD'} ${p.name}: ${linked ? 'linked' : 'NOT LINKED'}, ${names.length} samplers (${names.join(', ')})`, ok ? 'ok' : 'bad');
  if (p.diagnostics) say(JSON.stringify(p.diagnostics, null, 1).slice(0, 4000), 'bad');
}
if (!result.programs.length) { result.ok = false; say('no terrain program was built', 'bad'); }
for (const e of errors) say(e.slice(0, 4000), 'bad');
result.errors = errors;
say(result.ok ? '\nall terrain programs compile and fit the sampler budget' : '\nPROBLEMS above', result.ok ? 'ok' : 'bad');
window.__terrainCheck = result;
</script>
</body>
</html>
