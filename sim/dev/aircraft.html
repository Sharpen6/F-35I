<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F-35I aircraft test page</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 12px/1.35 system-ui, sans-serif; color: #e8ecef; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 290px; overflow-y: auto; padding: 8px 10px 16px;
           background: rgba(16, 20, 24, 0.82); box-sizing: border-box; }
  #panel.hidden { display: none; }
  #panel h1 { font-size: 13px; margin: 2px 0 6px; font-weight: 600; }
  #panel h2 { font-size: 11px; margin: 10px 0 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #9fb3c2; }
  .row { display: grid; grid-template-columns: 88px 1fr 44px; align-items: center; gap: 4px; margin: 1px 0; }
  .row input[type=range] { width: 100%; }
  .row span { text-align: right; font-variant-numeric: tabular-nums; color: #b9c6cf; }
  .checks label { display: inline-block; margin: 2px 8px 2px 0; }
  .buttons button { margin: 2px 2px 2px 0; padding: 3px 7px; background: #2b3540; color: #e8ecef; border: 1px solid #41505e; border-radius: 3px; cursor: pointer; }
  .buttons button:hover { background: #3a4754; }
  #status { position: fixed; left: 8px; bottom: 6px; color: #cfd8de; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #toggle { position: fixed; top: 6px; right: 298px; z-index: 2; background: rgba(16,20,24,0.8); color: #e8ecef; border: 1px solid #41505e; border-radius: 3px; cursor: pointer; }
  #panel.hidden + #toggle { right: 6px; }
</style>
<script type="importmap">
{"imports": {"three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/"}}
</script>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>F-35I Adir: aircraft test page</h1>
  <div class="buttons" id="views"></div>
  <h2>Scene</h2>
  <div class="checks">
    <label><input type="checkbox" id="night"> night</label>
    <label><input type="checkbox" id="air"> in the air</label>
    <label><input type="checkbox" id="animate"> animate</label>
  </div>
  <h2>Lights</h2>
  <div class="checks" id="lights"></div>
  <h2>Controls</h2>
  <div id="controls"></div>
</div>
<button id="toggle">panel</button>
<div id="status">loading...</div>
<script type="module" src="./aircraft.js"></script>
</body>
</html>
